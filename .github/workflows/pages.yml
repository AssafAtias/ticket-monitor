name: pages

# Deploys only when the site itself changes. Data updates go to the `data`
# branch and are fetched by the browser, so a number changing never
# redeploys the site - which also keeps us clear of Pages' soft limit of
# 10 builds per hour.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site without its tests
        run: |
          mkdir -p _site
          rsync -a --exclude='*.test.js' site/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
